include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    public_member_api_docs: false
    # Лимит 80 символов из very_good_analysis: кодовая база использует
    # dart format с лимитом 100+, длинные строки — норма, а не ошибка.
    lines_longer_than_80_chars: false
