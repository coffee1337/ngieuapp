name: Mobile CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Analyze, test and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Gradle 8.14 + AGP 8.11 support JDK 17–21; the runner's default JDK drifts
      # ahead of that range, so the build toolchain pins its own.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Pinned to the SDK range declared in pubspec.yaml: newer stable releases raise
      # the Gradle floor above the wrapper this project ships (8.14).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build apk --release

  ios:
    name: Build iOS widgets and app
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --debug
